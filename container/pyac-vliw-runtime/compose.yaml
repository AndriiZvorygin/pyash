services:
  pyac-vliw-runtime:
    container_name: pyac-vliw-runtime
    build:
      context: ../..
      dockerfile: container/pyac-vliw-runtime/Dockerfile
      network: host
    image: liberit/pyac-vliw-runtime:latest
    restart: "no"
    networks:
      - housekeeper
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYAC_VLIW_RUNTIME_HOST=0.0.0.0
      - PYAC_VLIW_RUNTIME_PORT=18887
      - PYAC_VLIW_RUNTIME_CONCURRENCY=${PYAC_VLIW_RUNTIME_CONCURRENCY:-1}
      - PYAC_VLIW_RUNTIME_TIMEOUT_SEC=${PYAC_VLIW_RUNTIME_TIMEOUT_SEC:-1800}
      - PYAC_VLIW_WORKER_PATH=/service/pyac-vliw-gpu-worker
      - PYAC_VLIW_SPIRV_PATH=/service/pyac_vliw_gpu_kernel.spv
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
    volumes:
      - type: bind
        source: ${NVIDIA_VULKAN_ICD_PATH:-/usr/share/vulkan/icd.d/nvidia_icd.json}
        target: /usr/share/vulkan/icd.d/nvidia_icd.json
        read_only: true
        bind:
          create_host_path: false

networks:
  housekeeper:
    external: true
    name: ${GPU_HOUSEKEEPER_VLIW_DOCKER_NETWORK:-gpu-housekeeper_default}
