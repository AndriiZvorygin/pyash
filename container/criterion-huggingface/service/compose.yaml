services:
  criterion-huggingface:
    container_name: criterion-huggingface
    build:
      context: ../../..
      dockerfile: container/criterion-huggingface/Dockerfile
    image: liberit/criterion-huggingface:latest
    restart: unless-stopped
    working_dir: /service
    ports:
      - "${CRITERION_HUGGINGFACE_PUBLISH_PORT:-8020}:8020"
    volumes:
      - ${CRITERION_HUGGINGFACE_WORKSPACE:-../../..}/container/criterion-huggingface/cache:/cache
    environment:
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface
      - TORCH_HOME=/cache/torch
    extra_hosts:
      - host.docker.internal:host-gateway
