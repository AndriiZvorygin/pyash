services:
  speaker:
    container_name: speaker
    build:
      context: ../../..
      dockerfile: container/speaker/Dockerfile
    image: liberit/speaker:latest
    user: "${PYASH_UID}:${PYASH_GID}"
    working_dir: /workplace
    entrypoint: ["python3", "/service/server.py"]
    command: ["--host", "${SPEAKER_BIND_HOST:-::}", "--port", "${SPEAKER_BIND_PORT:-8010}"]
    ports:
      - "${SPEAKER_PUBLISH_PORT:-8010}:${SPEAKER_BIND_PORT:-8010}"
    volumes:
      - ${SPEAKER_WORKSPACE:-../../..}:/workplace
      - ${SPEAKER_WORKSPACE:-../../..}/container/speaker/service/server.py:/service/server.py:ro
      - ${SPEAKER_WORKSPACE:-../../..}/container/speaker/cache:/cache
    environment:
      - SPEAKER_VOICES_DIR=${SPEAKER_VOICES_DIR:-/workplace/world/voices}
      - SPEAKER_TEMP_DIR=${SPEAKER_TEMP_DIR:-/workplace/world/temporary/speaker}
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface
      - TORCH_HOME=/cache/torch
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - speaker-net

networks:
  speaker-net:
    enable_ipv6: true
