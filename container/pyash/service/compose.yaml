services:
  pyash:
    container_name: pyash
    build:
      context: ../../..
      dockerfile: container/pyash/Dockerfile
    image: liberit/pyash:latest
    user: "${PYASH_UID}:${PYASH_GID}"
    working_dir: /workplace
    volumes:
      - ../../..:/workplace
      - ../minds:/minds
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
    environment:
      - AI_HOST=${AI_HOST:-http://mriczo:11434}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://mriczo:11434}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - TERM=xterm-256color
    extra_hosts:
      - host.docker.internal:host-gateway
