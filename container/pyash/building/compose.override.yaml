# Generated by container/update_compose.mjs
services:
  pyash:
    user: "${PYASH_UID}:${PYASH_GID}"
    environment:
      - HOME=/home/htaf
      - NPM_CONFIG_PREFIX=/home/htaf/.npm-global
      - PATH=/home/htaf/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - CODEX_HOME=/home/htaf/.codex
      - TZ=America/Toronto
    command: ["/workplace/container/command/run_vnc_novnc.sh"]
    ports:
      - "5900:5900"
      - "6080:6080"
    volumes:
      - "${PYASH_CONTAINER_HOME_DIR}:/home/htaf"
      - "${PYASH_SSH_DIR}:/home/htaf/.ssh:ro"
      - "${PYASH_SSH_KNOWN_HOSTS}:/home/htaf/.ssh/known_hosts"
      - "${PYASH_CODEX_DIR}:/home/htaf/.codex"
      - "${PYASH_GITCONFIG}:/home/htaf/.gitconfig:ro"
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
