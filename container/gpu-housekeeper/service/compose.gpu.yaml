services:
  gpu-housekeeper:
    container_name: gpu-housekeeper
    build:
      context: ../../..
      dockerfile: container/gpu-housekeeper/Dockerfile
    image: liberit/gpu-housekeeper:latest
    entrypoint: ["python3", "/service/server.py"]
    command: ["--host", "0.0.0.0", "--port", "8090", "--host-id", "${GPU_HOUSEKEEPER_HOST_ID:-gpu-housekeeper}"]
    restart: unless-stopped
    ports:
      - "${GPU_HOUSEKEEPER_PUBLISH_PORT:-8090}:8090"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - GPU_HOUSEKEEPER_HOST_ID=${GPU_HOUSEKEEPER_HOST_ID:-gpu-housekeeper}
      - GPU_HOUSEKEEPER_PEERS=${GPU_HOUSEKEEPER_PEERS:-}
      - GPU_HOUSEKEEPER_PEER_TIMEOUT_MS=${GPU_HOUSEKEEPER_PEER_TIMEOUT_MS:-1500}
      - GPU_HOUSEKEEPER_PEER_FAILURE_LIMIT=${GPU_HOUSEKEEPER_PEER_FAILURE_LIMIT:-3}
      - GPU_HOUSEKEEPER_ACCEPT_FORWARDED=${GPU_HOUSEKEEPER_ACCEPT_FORWARDED:-true}
      - GPU_HOUSEKEEPER_RUNTIME_REGISTRY=${GPU_HOUSEKEEPER_RUNTIME_REGISTRY:-}
      - GPU_HOUSEKEEPER_IDLE_GRACE_SEC=${GPU_HOUSEKEEPER_IDLE_GRACE_SEC:-300}
      - GPU_HOUSEKEEPER_ALLOW_MODEL_PULL=${GPU_HOUSEKEEPER_ALLOW_MODEL_PULL:-false}
      - GPU_HOUSEKEEPER_MODEL_ALLOWLIST=${GPU_HOUSEKEEPER_MODEL_ALLOWLIST:-}
      - GPU_HOUSEKEEPER_OLLAMA_MODEL_STORE_PATH=${GPU_HOUSEKEEPER_OLLAMA_MODEL_STORE_PATH:-/root/.ollama}
      - GPU_HOUSEKEEPER_OLLAMA_CATALOG_TTL_SEC=${GPU_HOUSEKEEPER_OLLAMA_CATALOG_TTL_SEC:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
