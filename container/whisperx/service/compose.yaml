services:
  whisperx:
    container_name: whisperx
    image: ghcr.io/jim60105/whisperx:no_model
    working_dir: /workplace
    entrypoint: ["python3", "/service/server.py"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ${WHISPERX_WORKSPACE:-../../..}:/workplace
      - ${WHISPERX_WORKSPACE:-../../..}/container/whisperx/cache:/root/.cache
      - ${WHISPERX_WORKSPACE:-../../..}/container/whisperx/service/server.py:/service/server.py:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - HF_HOME=/root/.cache/huggingface
      - TORCH_HOME=/root/.cache/torch
      - MPLCONFIGDIR=/root/.cache/matplotlib
    extra_hosts:
      - host.docker.internal:host-gateway
