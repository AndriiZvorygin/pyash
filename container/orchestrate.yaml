version: "3.8"
services:
  pyash:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: pyash-dev
    working_dir: /workplace
    volumes:
      - ..:/workplace
    stdin_open: true
    tty: true
    ports:
      - "5900:5900"
      - "6080:6080"
    command: ["/workplace/container/run_vnc_novnc.sh"]
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - host.docker.internal:host-gateway
