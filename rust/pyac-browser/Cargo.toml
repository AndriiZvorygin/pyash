[package]
name = "pyac-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyac = { path = "../pyac" }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu", "wgsl"] }
