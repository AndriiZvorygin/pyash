[package]
name = "pyac-vliw-gpu-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bytemuck = "1.24"
pollster = "1.0"
pyac = { path = "../../pyac" }
pyac-vliw-core = { path = "../../pyac-vliw-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "vulkan-portability", "spirv"] }

[[bin]]
name = "pyac-vliw-runtime"
path = "src/bin/vliw_runtime.rs"

[workspace]
