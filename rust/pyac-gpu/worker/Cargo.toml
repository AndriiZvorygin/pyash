[package]
name = "pyac-vliw-gpu-worker"
version = "0.1.0"
edition = "2024"
publish = false

[features]
cuda = ["dep:libloading", "dep:sha2"]

[dependencies]
axum = "0.8"
base64 = "0.22"
bytemuck = "1.24"
libloading = { version = "0.8.9", optional = true }
pollster = "1.0"
pyac = { path = "../../pyac" }
pyac-vliw-core = { path = "../../pyac-vliw-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "vulkan-portability", "spirv"] }

[[bin]]
name = "pyac-vliw-runtime"
path = "src/bin/vliw_runtime.rs"

[[bin]]
name = "pyac-vliw-pipeline-compiler"
path = "src/bin/vliw_pipeline_compiler.rs"

[workspace]
