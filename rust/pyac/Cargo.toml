[package]
name = "pyac"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pyac-dictionary"
path = "src/bin/pyac-dictionary.rs"

[[bench]]
name = "dictionary_index"
harness = false

[dependencies]
pyac-vliw-core = { path = "../pyac-vliw-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
