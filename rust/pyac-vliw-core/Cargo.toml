[package]
name = "pyac-vliw-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"

[features]
default = ["shader-f64"]
shader-f64 = []

[lib]
path = "src/semantics_runtime.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }
