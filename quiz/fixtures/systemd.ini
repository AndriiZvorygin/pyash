# /etc/systemd/system/roundtrip-demo.service

[Unit]
Description=Round-trip demo service (feature coverage)
Documentation=man:systemd.service(5) man:systemd.exec(5)
Wants=network-online.target
After=network-online.target
Wants=time-sync.target
After=time-sync.target
Requires=local-fs.target
After=local-fs.target
Conflicts=shutdown.target
Before=shutdown.target
ConditionPathIsExecutable=/usr/local/bin/roundtrip-demo
ConditionPathExists=/etc/roundtrip-demo/roundtrip-demo.env

# Start limiting (unit-level knobs)
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# Lifecycle model
Type=notify
NotifyAccess=main

# Identity and runtime context
User=roundtrip
Group=roundtrip
UMask=0027
WorkingDirectory=/var/lib/roundtrip-demo

# Environment
Environment=APP_MODE=demo
Environment=APP_LOG_LEVEL=info
EnvironmentFile=/etc/roundtrip-demo/roundtrip-demo.env

# Filesystem locations created by systemd
RuntimeDirectory=roundtrip-demo
RuntimeDirectoryMode=0750
StateDirectory=roundtrip-demo
StateDirectoryMode=0750
CacheDirectory=roundtrip-demo
CacheDirectoryMode=0750
LogsDirectory=roundtrip-demo
LogsDirectoryMode=0750

# Exec chain
ExecStartPre=/usr/bin/test -x /usr/local/bin/roundtrip-demo
ExecStartPre=/usr/bin/mkdir -p /run/roundtrip-demo
ExecStart=/usr/local/bin/roundtrip-demo --config=/etc/roundtrip-demo/config.ini
ExecStartPost=/usr/bin/logger -t roundtrip-demo "started"
ExecReload=/bin/kill -HUP $MAINPID
ExecStop=/bin/kill -TERM $MAINPID
ExecStopPost=/usr/bin/logger -t roundtrip-demo "stopped"

# Restart behaviour
Restart=on-failure
RestartSec=2s
TimeoutStartSec=30s
TimeoutStopSec=30s
WatchdogSec=45s

# Process management
KillMode=mixed
KillSignal=SIGTERM
FinalKillSignal=SIGKILL
SendSIGKILL=yes
GuessMainPID=yes

# Resource controls
CPUAccounting=yes
MemoryAccounting=yes
IOAccounting=yes
TasksAccounting=yes
CPUWeight=200
IOWeight=200
MemoryMax=300M
TasksMax=128
LimitNOFILE=16384
LimitNPROC=512

# Logging
SyslogIdentifier=roundtrip-demo
StandardOutput=journal
StandardError=journal

# Security hardening
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
CapabilityBoundingSet=
AmbientCapabilities=
DevicePolicy=closed

# Allow only specific paths to be writable (in addition to State/Cache/Logs/Runtime dirs)
ReadWritePaths=/etc/roundtrip-demo
ReadOnlyPaths=/usr/local/bin/roundtrip-demo

# Network sandboxing (tighten if your daemon requires outbound access)
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

[Install]
WantedBy=multi-user.target
Alias=roundtrip-demo.service
Also=roundtrip-demo.timer
