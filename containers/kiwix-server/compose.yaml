services:
  kiwix-server:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    command: ["*.zim"]
    ports:
      - target: 8080
        published: "8091"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 8080
        published: "8091"
        host_ip: "::"
        protocol: tcp
    volumes:
      - "../../world/library/archive:/data:ro"
    restart: unless-stopped
