<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Full-text search across the Pyash offline documentation library.">
  <title>Pyash Documentation Search</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .3rem; }
    .subtle, small { opacity: .75; }
    form { display: flex; gap: .6rem; margin: 1.5rem 0; }
    input { flex: 1; min-width: 0; padding: .75rem; font: inherit; }
    button { padding: .65rem 1rem; font: inherit; cursor: pointer; }
    article { border-top: 1px solid #8888; padding: 1rem 0; }
    article h2 { font-size: 1.15rem; margin: 0; }
    article p { margin: .45rem 0 0; }
    a { overflow-wrap: anywhere; }
    #status { min-height: 1.5em; }
    nav { margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Pyash documentation</h1>
    <p class="subtle">Full-text search across the documentation archive.</p>
  </header>
  <form id="search-form">
    <label for="query" hidden>Search documentation</label>
    <input id="query" name="q" type="search" placeholder="Search documentation" autocomplete="off" required>
    <button type="submit">Search</button>
  </form>
  <p id="status" role="status" aria-live="polite">Enter a word or phrase to search.</p>
  <main id="results" aria-live="polite"></main>
  <nav><a href="/library">Browse the Kiwix archive catalog</a></nav>
  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("query");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    function queryFromHash() {
      return new URLSearchParams(window.location.hash.slice(1)).get("q")?.trim() ?? "";
    }

    function setHashQuery(query) {
      const params = new URLSearchParams(window.location.hash.slice(1));
      params.set("q", query);
      history.replaceState(null, "", `${window.location.pathname}#${params.toString()}`);
    }

    function textElement(tag, value, className = "") {
      const element = document.createElement(tag);
      element.textContent = value;
      if (className) element.className = className;
      return element;
    }

    function originalPageUrl(entry) {
      const separator = entry.indexOf("/");
      const host = separator < 0 ? entry : entry.slice(0, separator);
      if (!/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/iu.test(host)) return "";
      try {
        return new URL(`https://${entry}`).toString();
      } catch {
        return "";
      }
    }

    function renderResults(xmlText) {
      const xml = new DOMParser().parseFromString(xmlText, "application/xml");
      if (xml.querySelector("parsererror")) throw new Error("The search service returned invalid XML.");
      const items = [...xml.querySelectorAll("item")];
      const total = xml.getElementsByTagNameNS("*", "totalResults")[0]?.textContent ?? String(items.length);
      results.replaceChildren();
      for (const item of items) {
        const title = item.querySelector("title")?.textContent?.trim() ?? "Untitled result";
        const rawLink = item.querySelector("link")?.textContent?.trim() ?? "";
        const target = new URL(rawLink, window.location.origin);
        if (target.origin !== window.location.origin) continue;
        const archive = item.querySelector("book title")?.textContent?.trim() ?? "Pyash documentation";
        const entry = target.pathname.match(/^\/content\/[^/]+\/(.*)$/u)?.[1] ?? "";
        const snippet = item.querySelector("description")?.textContent?.replace(/\s+/gu, " ").trim() ?? "";
        const article = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");
        link.href = target.toString();
        link.textContent = title;
        heading.append(link);
        article.append(heading);
        let decodedEntry = entry;
        try {
          decodedEntry = decodeURIComponent(entry);
        } catch {
          // Keep the encoded archive path visible when it contains malformed escapes.
        }
        article.append(textElement("small", `${archive} · ${decodedEntry}`, "subtle"));
        const sourceUrl = originalPageUrl(decodedEntry);
        if (sourceUrl) {
          const sourceLink = document.createElement("a");
          sourceLink.href = sourceUrl;
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";
          sourceLink.textContent = "Open original page";
          article.append(document.createTextNode(" · "), sourceLink);
        }
        article.append(textElement("p", snippet));
        results.append(article);
      }
      status.textContent = items.length === 0 ? `No results found for “${input.value}”.` : `Showing ${items.length} of ${total} results for “${input.value}”.`;
    }

    async function search(query) {
      if (!query) {
        status.textContent = "Enter a word or phrase to search.";
        results.replaceChildren();
        return;
      }
      input.value = query;
      setHashQuery(query);
      status.textContent = "Searching the documentation archive…";
      results.replaceChildren();
      try {
        const params = new URLSearchParams({ pattern: query, format: "xml", pageLength: "50" });
        const response = await fetch(`/search?${params}`, { headers: { Accept: "application/rss+xml" } });
        if (!response.ok) throw new Error(`Search failed with HTTP ${response.status}.`);
        renderResults(await response.text());
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "Search failed.";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      void search(input.value.trim());
    });
    const initialQuery = queryFromHash();
    if (initialQuery) void search(initialQuery);
  </script>
</body>
</html>
