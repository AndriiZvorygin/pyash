name: Examples audit

# The example audit runs every example in examples/pyash through the real
# runner, one process per example. That takes about twelve minutes, so it is
# not on the per-push path: it runs monthly, and on a push once a hundred
# commits have landed since the last audit, whichever comes first. A run can
# also be started on demand.
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find the last successful audit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The listing is an object with the runs under workflow_runs. A
          # lookup that fails is not fatal: an unknown last audit means the
          # gate below runs the audit rather than skipping it.
          last="$(gh api "repos/${{ github.repository }}/actions/workflows/examples-audit.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
          echo "the last successful audit ran at ${last:-no commit}"
          echo "sha=$last" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # The whole history is needed to count the commits since the last
          # audit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Is the audit due?
        id: gate
        run: |
          verdict="$(node command/example_audit_due.mjs --event "${{ github.event_name }}" --last "${{ steps.last.outputs.sha }}")"
          echo "$verdict"
          echo "run=$(printf '%s\n' "$verdict" | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm install
      - name: Install the external tools the examples shell out to
        # The audit runs the examples for real, so it needs the same tools a
        # developer has: ffmpeg to record and burn, espeak-ng to speak, pandoc
        # to convert, and poppler to read PDFs. Without them the audit reports
        # a gap instead of exercising the example.
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg espeak-ng pandoc poppler-utils
      - name: Provision the sibling dictionary checkout
        # The translation subsystem reads its dictionary and glyph word lists
        # from the pyachso2n checkout that sits next to this repository.
        # A clone can fail on a flaky network, so it is retried: a run that
        # dies here has tested nothing at all.
        if: steps.gate.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            if git clone --depth 1 https://gitlab.com/pyac/pyachso2n.git ../pyachso2n; then
              exit 0
            fi
            rm -rf ../pyachso2n
            if [ "$attempt" = "3" ]; then
              echo "the sibling dictionary checkout could not be cloned"
              exit 1
            fi
            sleep 10
          done
      - name: Bootstrap external toolchains
        if: steps.gate.outputs.run == 'true'
        run: npm run bootstrap
      - name: Audit examples
        if: steps.gate.outputs.run == 'true'
        run: node command/audit_examples.mjs
      - name: Keep the per-example detail
        # The audit prints only the failures. The per-example detail is kept
        # here so a reader who wants the whole picture does not have to run
        # the audit again.
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-audit-report
          path: examples/out/example-audit.json
          if-no-files-found: warn
