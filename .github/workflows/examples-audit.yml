name: Examples audit

# The example audit runs every example in examples/pyash through the real
# runner, one process per example. That takes long enough to be worth keeping
# off the per-push path, so it runs on a schedule and on demand.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install the external tools the examples shell out to
        # The audit runs the examples for real, so it needs the same tools a
        # developer has: ffmpeg to record and burn, espeak-ng to speak, pandoc
        # to convert, and poppler to read PDFs. Without them the audit reports
        # a gap instead of exercising the example.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg espeak-ng pandoc poppler-utils
      - name: Provision the sibling dictionary checkout
        # The translation subsystem reads its dictionary and glyph word lists
        # from the pyachso2n checkout that sits next to this repository.
        # A clone can fail on a flaky network, so it is retried: a run that
        # dies here has tested nothing at all.
        run: |
          for attempt in 1 2 3; do
            if git clone --depth 1 https://gitlab.com/pyac/pyachso2n.git ../pyachso2n; then
              exit 0
            fi
            rm -rf ../pyachso2n
            if [ "$attempt" = "3" ]; then
              echo "the sibling dictionary checkout could not be cloned"
              exit 1
            fi
            sleep 10
          done
      - name: Bootstrap external toolchains
        run: npm run bootstrap
      - name: Audit examples
        run: node command/audit_examples.mjs
