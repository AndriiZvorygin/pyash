name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Bootstrap external toolchains
        run: npm run bootstrap
      - name: Run tests
        run: npm run test:ci
      - name: Check package size
        run: npm run package:check
