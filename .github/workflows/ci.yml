name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Bootstrap external toolchains
        run: npm run bootstrap -- --with-whisper
      - name: Check documentation prose
        run: npm run doc:prose
      - name: Check import graph
        run: npm run imports:check
      - name: Check house-facing surface
        run: npm run house:api:check
      - name: Run tests
        run: npm run test:ci
      - name: Check package size
        run: npm run package:check
