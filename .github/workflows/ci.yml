name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Bootstrap external toolchains
        run: npm run bootstrap -- --with-whisper
      - name: Provision the sibling dictionary checkout
        # The translation subsystem reads its dictionary and glyph word lists
        # from the pyachso2n checkout that sits next to this repository.
        # A clone can fail on a flaky network, so it is retried: a run that
        # dies here has tested nothing at all.
        run: |
          for attempt in 1 2 3; do
            if git clone --depth 1 https://gitlab.com/pyac/pyachso2n.git ../pyachso2n; then
              exit 0
            fi
            rm -rf ../pyachso2n
            if [ "$attempt" = "3" ]; then
              echo "the sibling dictionary checkout could not be cloned"
              exit 1
            fi
            sleep 10
          done
      - name: Install python worker dependencies
        # The speaker identity module drives a python worker that imports numpy.
        # Some runner images mark the system python as externally managed, so
        # fall back to the explicit override.
        run: python3 -m pip install --quiet numpy || python3 -m pip install --quiet --break-system-packages numpy
      - name: Check documentation prose
        run: npm run doc:prose
      - name: Check import graph
        run: npm run imports:check
      - name: Check house-facing surface
        # Clones the published house repositories and resolves every import
        # they make against this repository.
        run: npm run house:api:check
      - name: Run tests
        run: npm run test:ci
